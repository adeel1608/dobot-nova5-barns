[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = 
    emelianov/modbus-esp8266@^4.1.0
    Wire@^1.0
monitor_speed = 115200
upload_flags = -F
build_src_filter = +<*> -<mqtt_final.cpp> -<mqtt_can_bridge.cpp> -<nano_every.cpp> -<nano_every_scale_a.cpp> -<nano_every_frother.cpp>

[env:mqtt_bridge]
platform = atmelavr
board = micro
framework = arduino
lib_deps = 
    arduino-libraries/Ethernet@^2.0.2
    knolleary/PubSubClient@^2.8
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp> -<mqtt_can_bridge.cpp> -<nano_every.cpp> -<nano_every_scale_a.cpp> -<nano_every_frother.cpp>

[env:mqtt_can_bridge]
platform = atmelavr
board = micro
framework = arduino
lib_deps = 
    arduino-libraries/Ethernet@^2.0.2
    knolleary/PubSubClient@^2.8
    autowp/autowp-mcp2515@^1.3.1
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp> -<mqtt_final.cpp> -<nano_every.cpp> -<nano_every_scale_a.cpp> -<nano_every_frother.cpp>

[env:nano_every_scale_a]
platform = atmelmegaavr
board = nano_every
framework = arduino
lib_deps = 
    bogde/HX711@^0.7.5
    Wire@^1.0
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp> -<mqtt_final.cpp> -<mqtt_can_bridge.cpp> -<nano_every.cpp>

[env:nano_every_scale_b]
platform = atmelmegaavr
board = nano_every
framework = arduino
lib_deps = 
    bogde/HX711@^0.7.5
    Wire@^1.0
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp> -<mqtt_final.cpp> -<mqtt_can_bridge.cpp> -<nano_every_scale_a.cpp> 

[env:nano_every_frother]
platform = atmelmegaavr
board = nano_every
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<nano_every_frother.cpp>