apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-config
  namespace: barns
data:
  telegraf.conf: |
    # Telegraf Configuration for BARNS Logging

    [agent]
      interval = "1s"
      round_interval = true
      metric_batch_size = 1000
      metric_buffer_limit = 10000
      collection_jitter = "0s"
      flush_interval = "1s"
      flush_jitter = "0s"
      precision = "1ns"
      hostname = ""
      omit_hostname = false

    # UDP input for receiving logs from services
    [[inputs.socket_listener]]
      service_address = "udp://:8094"
      data_format = "influx"

    # Output to InfluxDB
    [[outputs.influxdb_v2]]
      urls = ["http://influxdb:8086"]
      token = "${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}"
      organization = "${DOCKER_INFLUXDB_INIT_ORG}"
      bucket = "${DOCKER_INFLUXDB_INIT_BUCKET}"
      timeout = "5s"






