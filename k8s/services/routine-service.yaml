apiVersion: v1
kind: Service
metadata:
  name: routine-service
  namespace: barns
  labels:
    app: routine-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: routine-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routine-service
  namespace: barns
  labels:
    app: routine-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routine-service
  template:
    metadata:
      labels:
        app: routine-service
    spec:
      imagePullSecrets:
      - name: gcr-json-key
      containers:
      - name: routine-service
        image: me-central2-docker.pkg.dev/qss-development-project/barns/barns-routine:latest
        imagePullPolicy: Always
        env:
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: url
        - name: ROUTINE_CONFIG_PATH
          value: "/app/config/tasks.json"
        - name: PYTHONPATH
          value: "/app"
        - name: DEBUG
          value: "false"
        - name: TELEGRAF_HOST
          value: "telegraf"
        - name: TELEGRAF_PORT
          value: "8094"
        volumeMounts:
        - name: routine-config
          mountPath: /app/config/tasks.json
          subPath: tasks.json
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import socket; socket.create_connection(('rabbitmq', 5672), timeout=5)"
          initialDelaySeconds: 45
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: routine-config
        configMap:
          name: routine-tasks-config






