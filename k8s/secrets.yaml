apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: barns
type: Opaque
stringData:
  username: admin
  password: admin123
  url: amqp://admin:admin123@rabbitmq:5672/
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: barns
type: Opaque
stringData:
  postgres-user: postgres
  postgres-password: postgres_admin
  # OMS database credentials
  oms-db: barns_oms
  oms-user: barns_user
  oms-password: barns_pass
  # Validation database credentials
  validation-db: barns_validation
  validation-user: validation_user
  validation-password: validation_pass
---
apiVersion: v1
kind: Secret
metadata:
  name: influxdb-secret
  namespace: barns
type: Opaque
stringData:
  admin-username: admin
  admin-password: barns_influx_pass
  admin-token: barns-super-secret-token
  org: barns
  bucket: logs
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: barns
type: Opaque
stringData:
  # Redis doesn't have password in current setup, but adding for future use
  password: ""






