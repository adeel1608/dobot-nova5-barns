apiVersion: v1
kind: Service
metadata:
  name: api-bridge
  namespace: barns
  labels:
    app: api-bridge
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: api-bridge
---
apiVersion: v1
kind: Service
metadata:
  name: api-bridge-external
  namespace: barns
  labels:
    app: api-bridge
spec:
  type: NodePort
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30000
      protocol: TCP
  selector:
    app: api-bridge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-bridge
  namespace: barns
  labels:
    app: api-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-bridge
  template:
    metadata:
      labels:
        app: api-bridge
    spec:
      containers:
      - name: api-bridge
        image: barns-api-bridge:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: url
        - name: PYTHONPATH
          value: "/app"
        - name: DEBUG
          value: "false"
        - name: TELEGRAF_HOST
          value: "telegraf"
        - name: TELEGRAF_PORT
          value: "8094"
        volumeMounts:
        - name: data
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: data
        emptyDir: {}






