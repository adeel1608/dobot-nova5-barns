version: '3.8'

services:
  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: barns-rabbitmq
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UIf
      - "1883:1883"    # MQTT port      
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - barns-network
    command: >
      sh -c "
        rabbitmq-plugins enable --offline rabbitmq_mqtt &&
        rabbitmq-server
      "
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for OMS queue management
  redis:
    image: redis:7-alpine
    container_name: barns-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - barns-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL for OMS data persistence
  postgres:
    image: postgres:15-alpine
    container_name: barns-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db-schema-oms.sql:/docker-entrypoint-initdb.d/02-oms-schema.sql
      - ./db-schema-validation.sql:/docker-entrypoint-initdb.d/03-validation-schema.sql
    networks:
      - barns-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # InfluxDB for centralized logging
  influxdb:
    image: influxdb:2.7-alpine
    container_name: barns-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: barns_influx_pass
      DOCKER_INFLUXDB_INIT_ORG: barns
      DOCKER_INFLUXDB_INIT_BUCKET: logs
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: barns-super-secret-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - barns-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Telegraf for log aggregation
  telegraf:
    image: telegraf:1.28-alpine
    container_name: barns-telegraf
    ports:
      - "8094:8094/udp"
    environment:
      DOCKER_INFLUXDB_INIT_ORG: barns
      DOCKER_INFLUXDB_INIT_BUCKET: logs
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: barns-super-secret-token
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - barns-network
    depends_on:
      influxdb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Validation Service
  validation-service:
    build:
      context: .
      dockerfile: services/validation/Dockerfile.dev
    container_name: barns-validation
    network_mode: host  # Use host network to access external RTSP cameras
    environment:
      RABBITMQ_URL: amqp://admin:admin123@localhost:5672/  # Changed to localhost for host network
      # database config 
      POSTGRES_HOST: localhost  # Changed to localhost for host network
      POSTGRES_PORT: 5432
      POSTGRES_DB: barns_validation
      POSTGRES_USER: validation_user
      POSTGRES_PASSWORD: validation_pass
      # detection config
      DETECTION_INTERVAL_SECONDS: 600  # 10minutes = 60 seconds * 10
      ENABLE_PERIODIC_DETECTION: "true"
      DETECTION_TIMEOUT_SECONDS: 30
      MAX_DETECTION_WORKERS: 3
      # python path
      PYTHONPATH: /app
      # logging
      DEBUG: "false"
      TELEGRAF_HOST: localhost
      TELEGRAF_PORT: 8094
    depends_on:
      rabbitmq:
        condition: service_healthy
      ####
      postgres:
        condition: service_healthy
      ####
    volumes:
      # Mount source code for real-time editing
      - ./shared:/app/shared
      - ./services/validation:/app/services/validation
      # Mount debug directories so you can access debug frames on Windows
      - ./services/validation/coffee_detection/debug_frames_coffee:/app/services/validation/coffee_detection/debug_frames_coffee
      - ./services/validation/cup_detection/debug_frames:/app/services/validation/cup_detection/debug_frames
      - ./services/validation/cup_detection/debug_frames_cup:/app/services/validation/cup_detection/debug_frames_cup
      - ./services/validation/cup_detection/models:/app/services/validation/cup_detection/models
    # networks removed - host mode doesn't use custom networks
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; socket.create_connection((\"localhost\", 5672), timeout=5)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Automation Service
  automation-service:
    build:
      context: .
      dockerfile: services/automation/Dockerfile.dev
    container_name: barns-automation
    environment:
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
      PYTHONPATH: /app
      DEBUG: "false"
      TELEGRAF_HOST: telegraf
      TELEGRAF_PORT: 8094
    depends_on:
      rabbitmq:
        condition: service_healthy
      validation-service:
        condition: service_healthy
    volumes:
      # Mount source code for real-time editing
      - ./shared:/app/shared
      - ./services/automation:/app/services/automation
    networks:
      - barns-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Routine Service
  routine-service:
    build:
      context: .
      dockerfile: services/routine/Dockerfile.dev
    container_name: barns-routine
    environment:
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
      ROUTINE_CONFIG_PATH: /app/config/tasks.json
      PYTHONPATH: /app
      DEBUG: "false"
      TELEGRAF_HOST: telegraf
      TELEGRAF_PORT: 8094
    depends_on:
      rabbitmq:
        condition: service_healthy
      validation-service:
        condition: service_healthy
      robot-arm-service:
        condition: service_healthy
    volumes:
      # Mount source code for real-time editing
      - ./shared:/app/shared
      - ./services/routine:/app/services/routine
      - ./config:/app/config
    networks:
      - barns-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; socket.create_connection((\"rabbitmq\", 5672), timeout=5)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Robot Arm Service
  robot-arm-service:
    build:
      context: .
      dockerfile: services/robot_arm/Dockerfile.dev
    container_name: barns-robot-arm
    environment:
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
      ROBOT_SIMULATION: "true"  # Set to false for hardware mode
      PYTHONPATH: /app
      DEBUG: "false"
      TELEGRAF_HOST: telegraf
      TELEGRAF_PORT: 8094
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      # Mount source code for real-time editing
      - ./shared:/app/shared
      - ./services/robot_arm:/app/services/robot_arm
    networks:
      - barns-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; socket.create_connection((\"rabbitmq\", 5672), timeout=10)'"]
      interval: 30s
      timeout: 20s  # Increased from 10s to handle parallel loads
      retries: 5  # Increased from 3 to be more resilient
      start_period: 60s  # Increased from 45s to allow more startup time
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Scheduler Service
  scheduler-service:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile.dev
    container_name: barns-scheduler
    environment:
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
      PYTHONPATH: /app
      DEBUG: "false"
      TELEGRAF_HOST: telegraf
      TELEGRAF_PORT: 8094
    depends_on:
      rabbitmq:
        condition: service_healthy
      validation-service:
        condition: service_healthy
      routine-service:
        condition: service_healthy
    volumes:
      # Mount source code for real-time editing
      - ./shared:/app/shared
      - ./services/scheduler:/app/services/scheduler
      - ./data:/app/data
    networks:
      - barns-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; socket.create_connection((\"rabbitmq\", 5672), timeout=5)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 50s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # OMS Service
  oms-service:
    build:
      context: .
      dockerfile: services/oms/Dockerfile.dev
    container_name: barns-oms
    environment:
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: barns_oms
      POSTGRES_USER: barns_user
      POSTGRES_PASSWORD: barns_pass
      PYTHONPATH: /app
      DEBUG: "false"
      TELEGRAF_HOST: telegraf
      TELEGRAF_PORT: 8094
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      # Mount source code for real-time editing
      - ./shared:/app/shared
      - ./services/oms:/app/services/oms
    networks:
      - barns-network
    ports:
      - "8002:8000"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # API Bridge Service (HTTP to RabbitMQ translator for dashboard)
  api-bridge:
    build:
      context: .
      dockerfile: services/api-bridge/Dockerfile.dev
    container_name: barns-api-bridge
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
      PYTHONPATH: /app
      DEBUG: "false"
      TELEGRAF_HOST: telegraf
      TELEGRAF_PORT: 8094
    depends_on:
      rabbitmq:
        condition: service_healthy
      validation-service:
        condition: service_healthy
      routine-service:
        condition: service_healthy
      scheduler-service:
        condition: service_healthy
    volumes:
      # Mount source code for real-time editing
      - ./shared:/app/shared
      - ./services/api-bridge:/app/services/api-bridge
      - ./data:/app/data
    networks:
      - barns-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Video Stream Service (keeping HTTP for streaming)
  video-stream-service:
    build:
      context: .
      dockerfile: services/video-stream/Dockerfile.dev
    container_name: barns-video-stream
    ports:
      - "8001:8000"
    environment:
      PYTHONPATH: /app
      DEBUG: "false"
      TELEGRAF_HOST: telegraf
      TELEGRAF_PORT: 8094
    devices:
      - /dev/video0:/dev/video0  # Primary webcam
      - /dev/video1:/dev/video1  # Secondary webcam (if available)
    privileged: true  # Required for camera access
    volumes:
      # Mount source code for real-time editing
      - ./shared:/app/shared
      - ./services/video-stream:/app/services/video-stream
      - /dev:/dev  # Access to device files
    networks:
      - barns-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/status', timeout=10).read()"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Dashboard (dev mode with hot reload)
  dashboard:
    build:
      context: .
      dockerfile: services/barns-dashboard/Dockerfile.dev
    container_name: barns-dashboard
    ports:
      - "3000:5173"  # Map to Vite dev server port
    environment:
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
      VIDEO_STREAM_URL: http://video-stream-service:8000
      API_BRIDGE_URL: http://api-bridge:8000
      VITE_API_BRIDGE_URL: http://localhost:8000
      VITE_VIDEO_STREAM_URL: http://localhost:8001
      VITE_INFLUX_URL: http://localhost:8086/api/v2
      VITE_INFLUX_TOKEN: barns-super-secret-token
      VITE_INFLUX_ORG: barns
      VITE_INFLUX_BUCKET: logs
    depends_on:
      rabbitmq:
        condition: service_healthy
      api-bridge:
        condition: service_healthy
      oms-service:
        condition: service_started
    volumes:
      # Mount source code for real-time editing with hot reload
      - ./services/barns-dashboard:/app
      # Use named volume for node_modules to avoid conflicts
      - barns-dashboard-node-modules:/app/node_modules
    networks:
      - barns-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5173/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # RabbitMQ Management Tools (optional)
  rabbitmq-cli:
    image: rabbitmq:3.12-management
    container_name: barns-rabbitmq-cli
    environment:
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - barns-network
    profiles:
      - tools
    command: ["tail", "-f", "/dev/null"]  # Keep container running for CLI access
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rabbitmq_data:
  redis_data:
  postgres_data:
  influxdb_data:
  barns-dashboard-node-modules:

networks:
  barns-network:
    driver: bridge 